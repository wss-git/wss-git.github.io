<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H5电子钱包原型 - Tegro风格</title>
  <link href="https://cdn.tailwindcss.com/3.3.0" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: #f7f9fb;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(390px, 1fr));
      gap: 32px;
      padding: 32px;
      max-width: 1600px;
      margin: 0 auto;
      justify-items: center;
    }

    .page-card {
      background: #fff;
      border-radius: 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
      overflow: hidden;
      height: 844px;
      width: 390px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px;
      color: #222;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
    }

    .main-header {
      background: #fff;
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
    }

    .main-header .title {
      font-size: 22px;
      font-weight: 700;
      color: #222;
    }

    .main-header .header-actions i {
      font-size: 20px;
      margin-left: 20px;
      color: #222;
      cursor: pointer;
    }

    .asset-card {
      background: linear-gradient(135deg, #2b9cff 0%, #3be3e3 100%);
      color: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(43, 156, 255, 0.10);
      padding: 24px 20px 20px 20px;
      margin: 24px 20px 16px 20px;
      position: relative;
    }

    .asset-card .wallet-title {
      font-size: 16px;
      font-weight: 600;
      opacity: 0.95;
    }

    .asset-card .wallet-address {
      font-size: 30px !important;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .asset-card .asset-balance {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    .asset-card .asset-actions {
      display: flex;
      gap: 16px;
    }

    .asset-card .asset-actions button {
      flex: 1;
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 0;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(43, 156, 255, 0.08);
      cursor: pointer;
      transition: background 0.2s;
    }

    .asset-card .asset-actions button:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    .tab-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #fff;
      border-bottom: 1px solid #f0f0f0;
      height: 48px;
      margin: 0 0 8px 0;
    }

    .tab-bar .tab {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #8ca0b3;
      padding: 10px 0 8px 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border 0.2s;
    }

    .tab-bar .tab.active {
      color: #2b9cff;
      border-bottom: 2px solid #2b9cff;
      background: #f7f9fb;
    }

    .section-card {
      background: #f3f6fa;
      border-radius: 16px;
      margin: 16px 20px;
      padding: 18px 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
    }

    .token-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #eaf2fb;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .token-row .token-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .token-row .token-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2b9cff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
    }

    .token-row .token-name {
      font-size: 15px;
      font-weight: 600;
      color: #222;
    }

    .token-row .token-balance {
      font-size: 16px;
      font-weight: 700;
      color: #222;
    }

    .token-row .token-amount {
      font-size: 13px;
      color: #8ca0b3;
    }

    .custom-token-card {
      background: #eaf2fb;
      border-radius: 12px;
      padding: 18px 14px;
      text-align: center;
      color: #8ca0b3;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .manage-token-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #2b9cff;
      font-weight: 600;
      font-size: 15px;
      background: none;
      border: none;
      margin: 0 auto;
      margin-top: 6px;
      cursor: pointer;
    }

    .bottom-nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64px;
      background: #fff;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .bottom-nav .nav-item {
      flex: 1;
      text-align: center;
      color: #8ca0b3;
      font-size: 22px;
      padding-top: 8px;
      transition: color 0.2s;
    }

    .bottom-nav .nav-item.active {
      color: #2b9cff;
    }

    .bottom-nav .nav-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }

    /* 适配滚动 */
    .page-content {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 80px;
    }

    /* 按钮样式 */
    .btn-main {
      background: linear-gradient(90deg, #2b9cff 0%, #3be3e3 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 0;
      font-size: 17px;
      font-weight: 700;
      width: 100%;
      margin-top: 18px;
      box-shadow: 0 2px 8px rgba(43, 156, 255, 0.08);
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-main:active {
      background: linear-gradient(90deg, #3be3e3 0%, #2b9cff 100%);
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-label {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      margin-bottom: 6px;
      display: block;
    }

    .input-box {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e3eaf2;
      border-radius: 10px;
      font-size: 16px;
      background: #f7f9fb;
      color: #222;
      outline: none;
      transition: border 0.2s;
    }

    .input-box:focus {
      border: 1.5px solid #2b9cff;
      background: #fff;
    }

    .coin-select-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .coin-select-btn {
      flex: 1;
      background: #eaf2fb;
      border: 1.5px solid #eaf2fb;
      border-radius: 10px;
      padding: 10px 0;
      text-align: center;
      color: #2b9cff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: border 0.2s, background 0.2s;
    }

    .coin-select-btn.active {
      background: #fff;
      border: 1.5px solid #2b9cff;
    }

    .qr-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 24px 0 18px 0;
    }

    .qr-box {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #2b9cff 0%, #3be3e3 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 60px;
      margin-bottom: 14px;
    }

    .share-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .share-btn {
      flex: 1;
      background: #eaf2fb;
      color: #2b9cff;
      border: none;
      border-radius: 10px;
      padding: 10px 0;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .share-btn:active {
      background: #d0e7fa;
    }

    .nft-wall {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .nft-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(43, 156, 255, 0.08);
      overflow: hidden;
      margin-bottom: 2px;
    }

    .nft-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
    }

    .nft-card .nft-info {
      padding: 10px 10px 8px 10px;
    }

    .nft-card .nft-title {
      font-size: 15px;
      font-weight: 600;
      color: #222;
      margin-bottom: 2px;
    }

    .nft-card .nft-meta {
      font-size: 12px;
      color: #8ca0b3;
      margin-bottom: 4px;
    }

    .nft-card .nft-price {
      font-size: 14px;
      color: #2b9cff;
      font-weight: 700;
    }

    .profile-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #eaf2fb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #2b9cff;
      margin-right: 14px;
    }

    .profile-info {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: #222;
    }

    .profile-id {
      font-size: 13px;
      color: #8ca0b3;
    }

    .profile-section {
      background: #f3f6fa;
      border-radius: 16px;
      margin: 16px 20px;
      padding: 18px 16px;
    }

    .input-group .input-box {
      width: 100%;
      box-sizing: border-box;
      margin: 0;
    }

    .section-card {
      box-sizing: border-box;
    }

    .receive-address {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      color: #222;
      margin: 0 auto 8px auto;
    }

    .asset-card {
      /* min-height: 210px; */
      /* padding-top: 36px; */
      /* padding-bottom: 32px; */
    }
  </style>
</head>

<body>
  <a href="ntf/index">ntf</a>
</body>

</html>
