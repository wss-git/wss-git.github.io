<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .price-up {
            color: #10b981;
        }
        .price-down {
            color: #ef4444;
        }
        .announcement {
            animation: slide 15s linear infinite;
        }
        @keyframes slide {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 顶部用户信息 -->
    <div class="gradient-bg text-white p-6 pb-8">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center space-x-3">
                <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=50&h=50&fit=crop&crop=face" 
                     class="w-10 h-10 rounded-full border-2 border-white">
                <div>
                    <div class="font-semibold">张三</div>
                    <div class="text-xs opacity-80">ID: 888888</div>
                </div>
            </div>
            <div class="flex space-x-3">
                <i class="fas fa-bell text-xl"></i>
                <i class="fas fa-cog text-xl"></i>
            </div>
        </div>
        
        <!-- 资产总览 -->
        <div class="bg-white/20 backdrop-blur-sm rounded-2xl p-4 mb-4">
            <div class="text-center mb-4">
                <div class="text-2xl font-bold">$12,458.32</div>
                <div class="text-sm opacity-80">总资产价值</div>
            </div>
            <div class="grid grid-cols-3 gap-4 text-center">
                <div>
                    <div class="text-lg font-semibold">2,458.32</div>
                    <div class="text-xs opacity-80">QQC余额</div>
                </div>
                <div>
                    <div class="text-lg font-semibold">$8,245.60</div>
                    <div class="text-xs opacity-80">NFT持仓</div>
                </div>
                <div>
                    <div class="text-lg font-semibold">$1,754.40</div>
                    <div class="text-xs opacity-80">累计收益</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 快捷操作 -->
    <div class="px-6 -mt-4 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <div class="grid grid-cols-3 gap-4">
                <div class="text-center">
                    <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-exchange-alt text-blue-600"></i>
                    </div>
                    <div class="text-xs font-medium">转账</div>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-green-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-download text-green-600"></i>
                    </div>
                    <div class="text-xs font-medium">收款</div>
                </div>
                <div class="text-center">
                    <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center mx-auto mb-2">
                        <i class="fas fa-image text-purple-600"></i>
                    </div>
                    <div class="text-xs font-medium">NFT</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 公告轮播 -->
    <div class="px-6 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <div class="flex items-center space-x-3 mb-3">
                <i class="fas fa-bullhorn text-red-500"></i>
                <span class="font-semibold text-sm">重要公告</span>
            </div>
            <div class="overflow-hidden">
                <div class="announcement whitespace-nowrap text-sm text-gray-600">
                    🎉 新用户注册即送100 QQC！质押年化收益高达36.5%，邀请好友还有额外奖励！
                </div>
            </div>
        </div>
    </div>

    <!-- 行情看板 -->
    <div class="px-6 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2">
                    <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=32&h=32&fit=crop" 
                         class="w-8 h-8 rounded-full">
                    <div>
                        <div class="font-semibold">QQC/USD</div>
                        <div class="text-xs text-gray-500">QQC Token</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-lg font-bold">$5.23</div>
                    <div class="text-sm price-up">+2.45%</div>
                </div>
            </div>
            
            <!-- 简化走势图 -->
            <div class="h-20 bg-gray-50 rounded-lg flex items-end justify-between px-2 py-2">
                <div class="w-1 h-8 bg-green-400 rounded"></div>
                <div class="w-1 h-12 bg-green-400 rounded"></div>
                <div class="w-1 h-6 bg-green-400 rounded"></div>
                <div class="w-1 h-10 bg-green-400 rounded"></div>
                <div class="w-1 h-8 bg-green-400 rounded"></div>
                <div class="w-1 h-14 bg-green-400 rounded"></div>
                <div class="w-1 h-9 bg-green-400 rounded"></div>
                <div class="w-1 h-11 bg-green-400 rounded"></div>
                <div class="w-1 h-7 bg-green-400 rounded"></div>
                <div class="w-1 h-13 bg-green-400 rounded"></div>
            </div>
            
            <div class="mt-3 text-xs text-gray-500">
                24h成交量: $2.4M | 市值: $156.8M
            </div>
        </div>
    </div>

    <!-- 最近活动 -->
    <div class="px-6 mb-6">
        <div class="bg-white rounded-2xl p-4 card-shadow">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold">最近活动</h3>
                <span class="text-sm text-blue-600">查看全部</span>
            </div>
            <div class="space-y-3">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-plus text-green-600 text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm font-medium">质押收益到账</div>
                        <div class="text-xs text-gray-500">+12.45 QQC</div>
                    </div>
                    <div class="text-xs text-gray-400">2分钟前</div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-shopping-cart text-blue-600 text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm font-medium">NFT认购成功</div>
                        <div class="text-xs text-gray-500">#NFT-2024-001</div>
                    </div>
                    <div class="text-xs text-gray-400">1小时前</div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-purple-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-user-plus text-purple-600 text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-sm font-medium">邀请奖励</div>
                        <div class="text-xs text-gray-500">+25.80 QQC</div>
                    </div>
                    <div class="text-xs text-gray-400">3小时前</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
